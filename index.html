<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OncoLens AI</title>

<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{
  margin:0;
  background:#f7fafc;
  color:#19344d;
  font-family:Inter,system-ui,sans-serif
}

.card{
  background:#fff;
  border:1px solid #e6eef4;
  border-radius:18px;
  box-shadow:0 10px 28px rgba(27,76,111,.07)
}

.btn{
  border-radius:12px;
  height:40px;
  padding:0 16px;
  font-size:13px;
  font-weight:700
}

.grad{
  background:linear-gradient(90deg,#22b8cf,#2563eb);
  color:white
}

.fade{
  animation:f .25s ease both
}

@keyframes f{
  from{
    opacity:0;
    transform:translateY(5px)
  }
  to{
    opacity:1;
    transform:none
  }
}

@media print{
  .no-print{
    display:none!important
  }

  .print-wrap{
    margin:0!important;
    padding:0!important
  }

  .card{
    box-shadow:none!important
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const {useState,useEffect}=React;

const NAV=[
  ["dashboard","Dashboard"],
  ["newPatient","New Patient"],
  ["patients","Existing Patients"],
  ["analysis","New Analysis"],
  ["history","Case History"],
  ["compare","Compare Reports"],
  ["reports","Reports"],
  ["analytics","Analytics"],
  ["hospital","Hospital Integration"],
  ["cloud","Cloud Storage"],
  ["assistant","AI Assistant"],
  ["settings","Settings"]
];

const demoResult={
  patientId:"PT-7734",
  prediction:"Likely malignant",
  confidence:87.4,
  malignancyProbability:87.4,
  confidenceBand:"Moderate",
  modelStatus:"DEMO CASE",

  biomarkers:[
    {
      name:"ER/PR",
      priority:"High",
      rationale:"Prioritize confirmatory receptor testing after pathologist review."
    },
    {
      name:"HER2",
      priority:"High",
      rationale:"Prioritize confirmatory IHC/ISH if invasive malignancy is confirmed."
    },
    {
      name:"Ki-67",
      priority:"Medium",
      rationale:"Consider proliferative-index testing according to local protocol."
    }
  ],

  report:
    "AI-assisted assessment suggests a high-risk malignant pattern in the submitted H&E image. The attention overlay highlights regions that most influenced the model workflow. Reflex biomarker testing is prioritized for ER/PR and HER2, with Ki-67 as a secondary priority. Findings require pathologist confirmation.",

  disclaimer:
    "AI-assisted decision support only. Pathologist confirmation is required. Prototype pending clinical validation."
};

const patients=[
  {
    id:"PT-7734",
    name:"Jeet Sharma",
    age:52,
    cases:3
  },
  {
    id:"PT-7741",
    name:"Nisha Verma",
    age:47,
    cases:1
  },
  {
    id:"PT-7698",
    name:"Riya Singh",
    age:61,
    cases:2
  }
];


function App(){

  const [page,setPage]=useState("dashboard");

  const [api,setApi]=useState(
    localStorage.ol_api || ""
  );

  const [status,setStatus]=useState("idle");

  const [file,setFile]=useState(null);

  const [preview,setPreview]=useState("");

  const [patientId,setPatientId]=useState("PT-7734");

  const [result,setResult]=useState(demoResult);

  const [loading,setLoading]=useState(false);

  const [step,setStep]=useState(1);

  const [chat,setChat]=useState([
    {
      who:"ai",
      text:
        "Ask me about the current case, confidence, heatmap, or biomarker priorities."
    }
  ]);

  const [input,setInput]=useState("");

  const [specialists,setSpecialists]=useState(false);

  const [saved,setSaved]=useState(
    ()=>JSON.parse(localStorage.ol_reports || "[]")
  );


  useEffect(()=>{
    localStorage.ol_api=api
  },[api]);


  useEffect(()=>{
    localStorage.ol_reports=JSON.stringify(saved)
  },[saved]);


  const test=async()=>{

    if(!api){
      alert("Paste the Ngrok backend URL first.");
      return;
    }

    setStatus("testing");

    try{

      let r=await fetch(
        api.replace(/\/+$/,"")+"/health",
        {
          headers:{
            "ngrok-skip-browser-warning":"true"
          }
        }
      );

      if(!r.ok){
        throw 0;
      }

      setStatus("connected");

    }catch{

      setStatus("error");

      alert(
        "Backend not connected. Check FastAPI + Ngrok URL."
      );

    }
  };


  const upload=f=>{

    if(!f){
      return;
    }

    setFile(f);

    setPreview(
      URL.createObjectURL(f)
    );

    setStep(2);

    setTimeout(
      ()=>setStep(3),
      600
    );
  };


  const analyze=async()=>{

    if(!file){
      alert("Upload an H&E image first.");
      return;
    }

    if(!api){
      alert("Paste Ngrok URL first.");
      return;
    }

    setLoading(true);

    setStep(4);

    try{

      let fd=new FormData();

      fd.append(
        "file",
        file
      );

      fd.append(
        "patientId",
        patientId
      );


      let r=await fetch(
        api.replace(/\/+$/,"")+"/analyze",
        {
          method:"POST",

          headers:{
            "ngrok-skip-browser-warning":"true"
          },

          body:fd
        }
      );


      let d=await r.json();


      if(!r.ok){

        throw new Error(
          d.detail || "Analysis failed"
        );

      }


      setResult(d);

      setStatus("connected");

      setStep(5);


      setSaved(v=>[
        {
          ...d,

          createdAt:
            new Date().toISOString(),

          reportId:
            "RPT-"+Date.now().toString().slice(-6)
        },

        ...v
      ].slice(0,20));


    }catch(e){

      alert(e.message);

      setStep(3);

    }finally{

      setLoading(false);

    }

  };


  const ask=()=>{

    if(!input.trim()){
      return;
    }


    let q=input.toLowerCase();

    let a;


    if(q.includes("heat")){

      a=
        "The heatmap shows areas that most influenced the model. It is not a tumor segmentation map.";

    }

    else if(q.includes("her2")){

      a=
        "HER2 is a confirmatory-test priority suggestion only; the app does not claim HER2 positivity.";

    }

    else if(q.includes("confidence")){

      a=
        `Current displayed confidence is ${Number(result.confidence||0).toFixed(1)}%. Pathologist review is required.`;

    }

    else if(
      q.includes("summary") ||
      q.includes("case")
    ){

      a=result.report;

    }

    else if(
      q.includes("doctor") ||
      q.includes("specialist")
    ){

      a=
        "Opening the demo specialist directory.";

      setSpecialists(true);

    }

    else{

      a=
        "I can explain the current case, confidence, heatmap, biomarkers, report, or specialist options. I do not give a definitive diagnosis or treatment plan.";

    }


    setChat(c=>[
      ...c,

      {
        who:"user",
        text:input
      },

      {
        who:"ai",
        text:a
      }
    ]);


    setInput("");

  };


  return(

    <div className="min-h-screen flex">


      <aside className="
        no-print
        fixed
        left-0
        top-0
        bottom-0
        w-[245px]
        bg-white
        border-r
        border-slate-200
        flex
        flex-col
      ">


        <div className="
          h-[76px]
          px-5
          flex
          items-center
          gap-3
          border-b
        ">

          <div className="
            w-10
            h-10
            rounded-xl
            grad
            grid
            place-items-center
            text-xl
          ">
            ⌁
          </div>


          <div>

            <b>
              OncoLens AI
            </b>

            <div className="
              text-[10px]
              tracking-[.18em]
              text-slate-400
            ">
              INSIGHT COMPASS
            </div>

          </div>

        </div>


        <div className="
          p-3
          overflow-auto
          flex-1
        ">

          {
            NAV.map(
              ([id,label])=>

              <button
                onClick={()=>setPage(id)}
                key={id}

                className={`
                  w-full
                  text-left
                  px-4
                  py-2.5
                  rounded-xl
                  mb-1
                  text-[13px]
                  font-semibold

                  ${
                    page===id

                    ? "bg-cyan-50 text-cyan-700"

                    : "text-slate-500 hover:bg-slate-50"
                  }
                `}
              >

                {label}

              </button>
            )
          }

        </div>


        <div className="
          p-3
          border-t
        ">

          <button className="
            w-full
            px-4
            py-2.5
            text-left
            text-sm
            text-slate-500
          ">

            Logout

          </button>

        </div>

      </aside>



      <section className="
        ml-[245px]
        flex-1
      ">


        <header className="
          no-print
          sticky
          top-0
          z-20
          h-[76px]
          bg-white/95
          border-b
          px-6
          flex
          items-center
          gap-3
        ">


          <div className="
            flex-1
            max-w-[480px]
            h-10
            bg-slate-50
            border
            rounded-xl
            px-3
            flex
            items-center
          ">

            <span>
              ⌕
            </span>

            <input
              className="
                bg-transparent
                flex-1
                px-2
                text-sm
              "

              placeholder="
                Search patients, cases, reports...
              "
            />

          </div>



          <div className="
            ml-auto
            flex
            items-center
            gap-2
          ">


            <input
              value={api}

              onChange={
                e=>{
                  setApi(e.target.value);
                  setStatus("idle");
                }
              }

              className="
                hidden
                xl:block
                h-9
                w-[280px]
                px-3
                rounded-lg
                border
                text-xs
              "

              placeholder="
                Paste Ngrok URL
              "
            />


            <button
              onClick={test}

              className="
                hidden
                xl:block
                btn
                border
                bg-white
              "
            >

              Test

            </button>


            <div className={`
              px-3
              h-9
              rounded-full
              border
              flex
              items-center
              text-xs
              font-semibold

              ${
                status==="connected"

                ? "bg-emerald-50 text-emerald-700"

                : status==="error"

                ? "bg-rose-50 text-rose-700"

                : "bg-slate-50 text-slate-500"
              }
            `}>

              {
                status==="connected"

                ? "● Backend Connected"

                : status==="testing"

                ? "● Testing..."

                : status==="error"

                ? "● Backend Error"

                : "○ Backend"
              }

            </div>


            <div className="
              w-9
              h-9
              rounded-full
              bg-cyan-100
              grid
              place-items-center
              text-cyan-700
              font-bold
            ">

              KM

            </div>


            <div className="
              hidden
              md:block
            ">

              <div className="
                text-xs
                font-bold
              ">
                Dr. Kavya Mehra
              </div>

              <div className="
                text-[10px]
                text-slate-400
              ">
                Pathologist
              </div>

            </div>

          </div>

        </header>



        <main className="p-7">

          {
            page==="dashboard" &&

            <Dashboard
              setPage={setPage}
              setPatientId={setPatientId}
            />
          }


          {
            page==="newPatient" &&

            <NewPatient
              setPage={setPage}
            />
          }


          {
            page==="patients" &&

            <Patients
              setPage={setPage}
              setPatientId={setPatientId}
            />
          }


          {
            page==="analysis" &&

            <Analysis

              step={step}

              setStep={setStep}

              patientId={patientId}

              setPatientId={setPatientId}

              upload={upload}

              preview={preview}

              result={result}

              analyze={analyze}

              loading={loading}

              setPage={setPage}

              openSpecialists={
                ()=>setSpecialists(true)
              }
            />
          }


          {
            page==="history" &&

            <History
              saved={saved}
              setResult={setResult}
              setPage={setPage}
            />
          }


          {
            page==="compare" &&

            <Compare
              saved={saved}
            />
          }


          {
            page==="reports" &&

            <Reports
              r={result}

              openSpecialists={
                ()=>setSpecialists(true)
              }
            />
          }


          {
            page==="analytics" &&

            <Analytics/>
          }


          {
            page==="hospital" &&

            <Hospital/>
          }


          {
            page==="cloud" &&

            <Cloud/>
          }


          {
            page==="assistant" &&

            <Assistant

              chat={chat}

              input={input}

              setInput={setInput}

              ask={ask}

              result={result}
            />
          }


          {
            page==="settings" &&

            <Settings

              api={api}

              setApi={setApi}

              test={test}

              status={status}
            />
          }

        </main>

      </section>


      {
        specialists &&

        <Specialists
          close={
            ()=>setSpecialists(false)
          }
        />
      }

    </div>

  );
}



const Title=({
  k,
  t,
  s,
  children
})=>

<div className="
  flex
  justify-between
  items-end
  mb-6
">

  <div>

    <div className="
      text-xs
      tracking-[.12em]
      font-bold
      text-cyan-600
    ">
      {k}
    </div>

    <h1 className="
      text-3xl
      font-bold
      mt-1
    ">
      {t}
    </h1>

    <p className="
      text-sm
      text-slate-500
      mt-1
    ">
      {s}
    </p>

  </div>

  {children}

</div>;



function Dashboard({
  setPage,
  setPatientId
}){

  return(

    <div className="fade">


      <Title
        k="CLINICAL WORKSPACE"
        t="Dashboard"
        s="Overview of patients, analyses and reports."
      >

        <div className="flex gap-2">

          <button
            onClick={
              ()=>setPage("newPatient")
            }

            className="
              btn
              border
              bg-white
            "
          >
            + New Patient
          </button>


          <button
            onClick={
              ()=>setPage("analysis")
            }

            className="
              btn
              grad
            "
          >
            ⌁ New Analysis
          </button>

        </div>

      </Title>



      <div className="
        grid
        md:grid-cols-2
        xl:grid-cols-4
        gap-4
      ">

        {
          [
            ["Total Patients","28"],
            ["Completed Reports","19"],
            ["Pending Review","4"],
            ["High Priority","3"]
          ].map(
            x=>

            <div
              className="
                card
                p-5
              "

              key={x[0]}
            >

              <div className="
                text-xs
                text-slate-400
                uppercase
              ">
                {x[0]}
              </div>

              <div className="
                text-3xl
                font-bold
                mt-3
              ">
                {x[1]}
              </div>

              <div className="
                text-xs
                text-cyan-700
                mt-2
              ">
                Demo metric
              </div>

            </div>
          )
        }

      </div>



      <div className="
        grid
        xl:grid-cols-[1.25fr_.75fr]
        gap-5
        mt-5
      ">


        <div className="
          card
          overflow-hidden
        ">

          <div className="
            p-5
            border-b
          ">

            <b>
              Recent Patients
            </b>

          </div>


          {
            patients.map(
              p=>

              <div
                className="
                  p-4
                  border-b
                  flex
                  items-center
                "

                key={p.id}
              >


                <div className="
                  w-9
                  h-9
                  rounded-full
                  bg-cyan-50
                  grid
                  place-items-center
                  text-cyan-700
                  font-bold
                ">

                  {p.name[0]}

                </div>


                <div className="
                  ml-3
                  flex-1
                ">

                  <b className="text-sm">
                    {p.name}
                  </b>

                  <div className="
                    text-xs
                    text-slate-400
                  ">

                    {p.id}
                    {" • "}
                    {p.age}
                    {" yrs • "}
                    {p.cases}
                    {" cases"}

                  </div>

                </div>


                <button

                  onClick={
                    ()=>{

                      setPatientId(
                        p.id
                      );

                      setPage(
                        "analysis"
                      );

                    }
                  }

                  className="
                    btn
                    bg-cyan-50
                    text-cyan-700
                  "
                >

                  New Analysis

                </button>

              </div>
            )
          }

        </div>



        <div className="
          card
          p-5
        ">

          <b>
            Recent Activity
          </b>


          {
            [
              "PT-7734 analysis completed",
              "Report reviewed",
              "HER2 priority updated",
              "New patient added"
            ].map(
              (a,i)=>

              <div
                className="
                  flex
                  gap-3
                  mt-4
                "

                key={a}
              >

                <span className="
                  w-7
                  h-7
                  rounded-full
                  bg-emerald-50
                  grid
                  place-items-center
                  text-emerald-700
                ">
                  ✓
                </span>


                <div>

                  <div className="text-sm">
                    {a}
                  </div>

                  <div className="
                    text-xs
                    text-slate-400
                  ">
                    {i+1}h ago
                  </div>

                </div>

              </div>
            )
          }

        </div>

      </div>

    </div>
  );
}



function NewPatient({
  setPage
}){

  return(

    <div className="
      fade
      max-w-4xl
    ">


      <Title
        k="PATIENT MANAGEMENT"
        t="New Patient"
        s="Register a de-identified patient for the prototype."
      />


      <div className="
        card
        p-6
        grid
        md:grid-cols-2
        gap-4
      ">

        {
          [
            "Full Name",
            "Age",
            "Hospital ID",
            "Referring Doctor"
          ].map(
            x=>

            <label
              className="
                text-sm
                font-semibold
              "

              key={x}
            >

              {x}

              <input className="
                mt-2
                h-11
                w-full
                rounded-xl
                border
                px-3
                bg-slate-50
              "/>

            </label>
          )
        }


        <label className="
          text-sm
          font-semibold
        ">

          Gender

          <select className="
            mt-2
            h-11
            w-full
            rounded-xl
            border
            px-3
            bg-slate-50
          ">

            <option>
              Female
            </option>

            <option>
              Male
            </option>

            <option>
              Other
            </option>

          </select>

        </label>


        <div className="
          md:col-span-2
          text-right
        ">

          <button
            onClick={
              ()=>setPage("patients")
            }

            className="
              btn
              grad
            "
          >

            Save Patient

          </button>

        </div>

      </div>

    </div>
  );
}



function Patients({
  setPage,
  setPatientId
}){

  return(

    <div className="fade">


      <Title
        k="PATIENT MANAGEMENT"
        t="Existing Patients"
        s="Continue a previous case or start a new analysis."
      />


      <div className="
        grid
        lg:grid-cols-2
        xl:grid-cols-3
        gap-4
      ">

        {
          patients.map(
            p=>

            <div
              className="
                card
                p-5
              "

              key={p.id}
            >


              <div className="
                flex
                items-center
                gap-3
              ">

                <div className="
                  w-11
                  h-11
                  rounded-full
                  bg-cyan-50
                  grid
                  place-items-center
                  font-bold
                  text-cyan-700
                ">

                  {p.name[0]}

                </div>


                <div>

                  <b>
                    {p.name}
                  </b>

                  <div className="
                    text-xs
                    text-slate-400
                  ">
                    {p.id}
                  </div>

                </div>

              </div>



              <div className="
                grid
                grid-cols-2
                gap-2
                mt-4
              ">

                <div className="
                  bg-slate-50
                  rounded-xl
                  p-3
                  text-xs
                ">

                  Age

                  <br/>

                  <b>
                    {p.age}
                  </b>

                </div>


                <div className="
                  bg-slate-50
                  rounded-xl
                  p-3
                  text-xs
                ">

                  Cases

                  <br/>

                  <b>
                    {p.cases}
                  </b>

                </div>

              </div>


              <button

                onClick={
                  ()=>{

                    setPatientId(
                      p.id
                    );

                    setPage(
                      "analysis"
                    );

                  }
                }

                className="
                  btn
                  grad
                  w-full
                  mt-4
                "
              >

                New Case

              </button>

            </div>
          )
        }

      </div>

    </div>
  );
}



function Steps({
  step
}){

  return(

    <div className="
      card
      p-5
      flex
      gap-2
      overflow-auto
      mb-5
    ">

      {
        [
          "Case & Upload",
          "Quality Check",
          "Preprocessing",
          "AI Processing",
          "Results"
        ].map(
          (x,i)=>

          <div

            className={`
              flex-1
              min-w-[130px]
              text-xs
              font-bold

              ${
                step>=i+1

                ? "text-cyan-700"

                : "text-slate-400"
              }
            `}

            key={x}
          >


            <span className={`
              inline-grid
              place-items-center
              w-7
              h-7
              rounded-full
              mr-2

              ${
                step>=i+1

                ? "bg-cyan-600 text-white"

                : "bg-slate-100"
              }
            `}>

              {i+1}

            </span>

            {x}

          </div>
        )
      }

    </div>
  );
}



function Analysis({
  step,
  setStep,
  patientId,
  setPatientId,
  upload,
  preview,
  result,
  analyze,
  loading,
  setPage,
  openSpecialists
}){

  return(

    <div className="fade">


      <Title
        k="AI PATHOLOGY WORKFLOW"
        t="New Analysis"
        s="Five-step slide review from upload to explainable result."
      />


      <Steps
        step={step}
      />


      <div className="
        grid
        xl:grid-cols-[1.1fr_.9fr]
        gap-5
      ">


        <div className="
          card
          overflow-hidden
        ">


          <div className="
            p-5
            border-b
          ">

            <b>
              Case Details & H&E Upload
            </b>
